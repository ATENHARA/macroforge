# Macro ideas and script examples shown in the in-game window (Ideas button).
#
# Every entry is checked when the addon is built (mforge/suggest.py): the spells must exist for the
# class, the commands and conditionals must be known, the text must fit a macro, and a script must pass
# the script checker. An entry that fails is left out and reported, never shipped.
#
# macro: class (uppercase game token), name (16 characters at most), icon ("spell:Name" shows that
#        spell's icon), why (one short sentence for the card), body. The "needs level" shown on the
#        card is worked out from the spells in the body.
# script: example is the title of an entry in reference/script-examples.md (the body comes from there),
#         plus name, icon and why.

[[macro]]
class = "WARLOCK"
name = "Mouseover Fear"
icon = "spell:Fear"
why = "Fears the enemy under your mouse without changing your target. Falls back to your target."
body = """#showtooltip
/cast [@mouseover,harm,nodead][] Fear"""

[[macro]]
class = "WARLOCK"
name = "Curse Picker"
icon = "spell:Curse of the Elements"
why = "One button for curses: Elements, Shift for Weakness, Ctrl for Recklessness. Hits your mouseover enemy first."
body = """#showtooltip
/cast [mod:shift,@mouseover,harm,nodead][mod:shift] Curse of Weakness; [mod:ctrl,@mouseover,harm,nodead][mod:ctrl] Curse of Recklessness; [@mouseover,harm,nodead][] Curse of the Elements"""

